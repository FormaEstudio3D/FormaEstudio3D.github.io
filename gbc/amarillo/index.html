<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#312a10">
<title>Pokémon Amarillo</title>
<link rel="stylesheet" href="/estilo.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/iconos/amarillo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pokémon Amarillo">
<style>
  /* El color va acá y no lo calcula el JS: así la pantalla nace del
     color correcto en vez de empezar verde y saltar. */
  :root{--fondo:#312a10}
</style>
</head>
<body>
<script>
  /* ---- Lo único que cambia de un cartucho a otro ---- */
  window.JUEGO = {
    titulo: 'Pokémon Amarillo',
    rom:    '/roms/amarillo.gbc',
    /* 'gba' a propósito, aunque sea de Game Boy Color: así usa mGBA, el
       mismo motor que los GBA, que en el iPhone anda bien. Con 'gb'
       usaba gambatte y en iPhone se trababa y se reiniciaba. mGBA
       también corre juegos de GB y GBC. */
    core:    'gba',
    portada: '/portadas/amarillo.png'
  };
</script>
<script src="/app.js"></script>
</body>
</html>
